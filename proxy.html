<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy</title>
  <style>
      body {
      margin: 0;
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .proxy-header {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #2d2d2d;
      border-bottom: 1px solid #404040;
    }

    .tab-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #252525;
      gap: 8px;
    }

    .close-proxy-panel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: #3d3d3d;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-proxy-panel:hover {
      background: #4d4d4d;
    }

    .proxy-title {
      flex: 1;
      font-size: 0.9rem;
      color: #d0d0d0;
      padding: 4px 12px;
      background: #383838;
      border-radius: 6px 6px 0 0;
      margin-top: -4px;
    }

    .address-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      background: #2d2d2d;
    }

    .nav-buttons {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      color: #aaa;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: #3d3d3d;
      color: #fff;
    }

    .proxy-address {
      flex: 1;
      font-size: 0.85rem;
      color: #c0c0c0;
      background: #1e1e1e;
      border: 1px solid #404040;
      border-radius: 4px;
      padding: 6px 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proxy-actions {
      display: flex;
      gap: 8px;
    }

    .proxy-actions a {
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      color: #fff;
      background: #3d8bff;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .proxy-actions a:hover {
      background: #2a75e8;
    }

    .proxy {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
      display: block;
    }

    .status-bar {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #252525;
      border-top: 1px solid #404040;
      font-size: 0.8rem;
    }

    .notice {
      padding: 8px 12px;
      color: #b0b0b0;
      background: #2a2a2a;
      border-bottom: 1px solid #353535;
    }

    .proxy-debug {
      padding: 6px 12px;
      color: #9090ff;
      background: #1a1a2e;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.75rem;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="proxy-header">
    <a href="index.html" class="close-proxy-panel"><img src="assets/close.png" width="26" alt="Close"></a>
    <div class="proxy-title" id="proxyMessage">Scramjet Proxy Browser</div>
    <div class="proxy-address" id="proxyAddress">No target</div>
    <div class="proxy-actions">
      <a id="openRawLink" href="#" target="_blank" rel="noopener noreferrer">Open raw target</a>
    </div>
  </div>
  <div class="notice">This page loads the target through a real transport proxy host when configured. If no proxy is available, it falls back to the raw target URL.</div>
  <div class="proxy-debug" id="proxyDebug">Target debug: none</div>
  <iframe src="" class="proxy"></iframe>
  <script src="scramjet.js"></script>
  <script src="proxy.js"></script>
</body>
</html>
