<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #090b10; color: #f5f5f5; }
    .wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: min(100%, 900px); background: rgba(16, 20, 32, 0.95); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); padding: 28px; }
    .card h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 4vw, 3.2rem); }
    .card p { margin: 0.75rem 0; line-height: 1.7; color: #c8d1e0; }
    .poster { width: 100%; max-height: 480px; object-fit: cover; border-radius: 14px; margin-top: 1rem; }
    .back-link, .watch-link { display: inline-flex; align-items: center; justify-content: center; margin-top: 1rem; padding: 0.95rem 1.4rem; text-decoration: none; font-weight: 700; border-radius: 12px; }
    .back-link { background: rgba(255,255,255,0.08); color: #fff; margin-right: 1rem; }
    .watch-link { background: #4a8cff; color: white; }
    .button-row { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <a href="movie.html" class="back-link">← Back to cinema</a>
      <h1 id="playerTitle">Loading...</h1>
      <p id="playerLabel">Local player file</p>
      <img id="playerPoster" class="poster" src="" alt="Poster" style="display:none;">
      <p id="playerDescription">This file was opened directly from the movie list. Use it as the local landing page for the selected movie or episode.</p>
      <div class="button-row">
        <a id="watchButton" class="watch-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">Open Source</a>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'Untitled';
    const label = params.get('label') || 'Local player page';
    const poster = params.get('poster');
    const original = params.get('original');

    document.getElementById('playerTitle').textContent = title;
    document.getElementById('playerLabel').textContent = label;

    if (poster) {
      const posterImg = document.getElementById('playerPoster');
      posterImg.src = poster;
      posterImg.alt = title;
      posterImg.style.display = 'block';
    }

    if (original) {
      const watchButton = document.getElementById('watchButton');
      watchButton.href = original;
      watchButton.textContent = 'Open source page';
      watchButton.style.display = 'inline-flex';
    }
  </script>
</body>
</html>
